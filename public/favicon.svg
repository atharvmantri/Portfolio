<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f2fe" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek outer border with rounded corners -->
  <rect x="2" y="2" width="28" height="28" rx="6" stroke="url(#favGrad)" strokeWidth="2" fill="#080610" />
  
  <!-- Stylized Terminal Prompt Symbol -->
  <path d="M 10 9 L 17 16 L 10 23" stroke="url(#favGrad)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" filter="url(#favGlow)" />
  
  <!-- Pulsing cursor block -->
  <rect x="18" y="21" width="6" height="2.5" fill="#ec4899" rx="0.5" />
</svg>